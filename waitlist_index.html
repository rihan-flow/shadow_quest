<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

        <title>Shadow Quest</title>
        <link rel="stylesheet" href="waitlist_style.css">

    </head>

    <body>

        <main>

            <section id="hero">

                <div class="ambientGlow"></div>

                <div class="heroContent">

                    <span class="eyebrow">A quiet space for reflection</span>

                    <h2>Shadow Quest</h2>

                    <h1>A place to meet what you're carrying.</h1>
                    
                    <p class="heroDescription">Meet your shadow — one moment at a time.</p>

                    <div class="heroDivider"></div>

                    <form id="waitlistForm">

                        <input 
                            type="email"
                            id="emailInput" 
                            placeholder="Your email address"
                            autocomplete="email"
                            aria-label="Email address"
                            required >

                        <button type="submit">Join Waitlist</button>

                    </form>

                    <p class="privacyNote">A quieter place. Nothing to perform.</p>
                    <p id="message" aria-live="polite"></p>
                
                </div>
            </section>
        </main>

        <script src="waitlist_script.js"></script>

    </body>

</html>
